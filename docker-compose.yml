services:
  cms:
    build:
      context: ./cms
    environment:
      HOST: 0.0.0.0
      PORT: 1337
      APP_KEYS: ${APP_KEYS:?Set APP_KEYS in the root .env file}
      API_TOKEN_SALT: ${API_TOKEN_SALT:?Set API_TOKEN_SALT in the root .env file}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:?Set ADMIN_JWT_SECRET in the root .env file}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT:?Set TRANSFER_TOKEN_SALT in the root .env file}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the root .env file}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in the root .env file}
      DATABASE_CLIENT: ${DATABASE_CLIENT:-sqlite}
      DATABASE_FILENAME: ${DATABASE_FILENAME:-.tmp/data.db}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_HOST: ${DATABASE_HOST:-localhost}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:-strapi}
      DATABASE_USERNAME: ${DATABASE_USERNAME:-strapi}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
      DATABASE_SSL: ${DATABASE_SSL:-false}
    ports:
      - "1337:1337"
    volumes:
      - cms-data:/app/.tmp
      - cms-uploads:/app/public/uploads
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        STRAPI_URL: http://cms:1337
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      STRAPI_URL: http://cms:1337
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      CONTACT_TO: ${CONTACT_TO:-}
    depends_on:
      - cms
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  cms-data:
  cms-uploads:
